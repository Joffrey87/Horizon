<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Horizon — Tableau de bord personnel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Installable sur le téléphone (icône, raccourcis, partage vers Horizon).
      // Le service worker ne cache rien : voir public/sw.js.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => { /* pas installable, tant pis */ })
        })
      }
    </script>
  </body>
</html>
